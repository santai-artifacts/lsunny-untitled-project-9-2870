<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fruit Ninja</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #2a1a4a;
    --bg-1: #16213e;
    --accent: #ffd23f;
    --danger: #ff3b3b;
    --ink: #fff6e5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Fredoka', system-ui, sans-serif;
    background: #0d0a1f;
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: crosshair;
  }

  canvas { display: block; position: absolute; inset: 0; }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
  }

  .score-box { text-align: left; }
  .score-label {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.65;
    font-weight: 500;
  }
  .score-value {
    font-size: clamp(38px, 8vw, 64px);
    font-weight: 700;
    line-height: 0.95;
    color: var(--accent);
    text-shadow: 0 3px 0 rgba(0,0,0,0.25), 0 0 24px rgba(255,210,63,0.35);
  }
  .best { font-size: 14px; opacity: 0.6; font-weight: 500; margin-top: 2px; }

  .lives { display: flex; gap: 8px; }
  .life {
    width: 30px; height: 30px;
    transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
  }
  .life.lost { transform: scale(0.4) rotate(35deg); opacity: 0.25; filter: grayscale(1); }

  .combo-flash {
    position: absolute;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%) scale(0.5);
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
    pointer-events: none;
    opacity: 0;
    z-index: 6;
    white-space: nowrap;
  }
  .combo-flash.show { animation: comboPop 0.9s ease-out forwards; }
  @keyframes comboPop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.4) rotate(-6deg); }
    25%  { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(3deg); }
    70%  { opacity: 1; transform: translate(-50%,-60%) scale(1) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%,-90%) scale(0.95); }
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    gap: 22px;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 35%, rgba(42,26,74,0.75), rgba(9,7,24,0.94));
    backdrop-filter: blur(6px);
    z-index: 10;
    transition: opacity 0.35s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .title {
    font-size: clamp(52px, 13vw, 120px);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #fff 0%, var(--accent) 55%, #ff8a3c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,0.28));
  }
  .title .slash {
    display: inline-block;
    color: var(--danger);
    -webkit-text-fill-color: var(--danger);
    transform: rotate(-8deg);
  }
  .subtitle { font-size: 17px; opacity: 0.75; max-width: 30ch; line-height: 1.5; font-weight: 400; }

  .btn {
    pointer-events: auto;
    font-family: inherit;
    font-size: 22px;
    font-weight: 600;
    color: #2a1a12;
    background: linear-gradient(180deg, #ffe083, var(--accent));
    border: none;
    padding: 16px 46px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c99700, 0 10px 22px rgba(0,0,0,0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c99700, 0 14px 26px rgba(0,0,0,0.45); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99700, 0 6px 14px rgba(0,0,0,0.4); }

  .final-score { font-size: 20px; font-weight: 500; }
  .final-score b { color: var(--accent); font-size: 30px; font-weight: 700; }
  .new-best {
    color: var(--danger);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.5; } }

  .hint { font-size: 14px; opacity: 0.55; font-weight: 400; }
  .readme-link {
    pointer-events: auto;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border-bottom: 2px solid rgba(255,210,63,0.7);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .readme-link:hover { color: #fff; border-color: #fff; }
  .emoji-row { font-size: clamp(30px, 7vw, 46px); letter-spacing: 6px; }

  /* ---------- Theme picker ---------- */
  .theme-picker { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .theme-label {
    font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0.55; font-weight: 500;
  }
  .themes { display: flex; gap: 12px; }
  .theme-swatch {
    pointer-events: auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .theme-swatch:hover { transform: scale(1.12); }
  .theme-swatch > span {
    width: 12px; height: 12px; border-radius: 50%;
    box-shadow: 0 0 6px rgba(0,0,0,0.45);
  }
  .theme-swatch.active {
    border-color: #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25), 0 4px 12px rgba(0,0,0,0.4);
    transform: scale(1.12);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="score-box">
      <div class="score-label">Score</div>
      <div class="score-value" id="score">0</div>
      <div class="best" id="best">Best 0</div>
    </div>
    <div class="lives" id="lives"></div>
  </div>

  <div class="combo-flash" id="combo"></div>

  <!-- Start -->
  <div class="overlay" id="startScreen">
    <div class="emoji-row">🍉 🍊 🍋 🥝 🍎</div>
    <h1 class="title">FRUIT<span class="slash">/</span>NINJA</h1>
    <p class="subtitle">Swipe to slice the fruit. Chain slices for combo bonuses. Miss three and it's over — and whatever you do, <b>don't</b> cut the bombs.</p>
    <button class="btn" id="startBtn">Play</button>
    <p class="hint">Drag with your mouse or finger to swipe · <a class="readme-link" href="README.md" target="_blank" rel="noopener">Read me</a></p>
  </div>

  <!-- Game over -->
  <div class="overlay hidden" id="overScreen">
    <div class="emoji-row" id="overEmoji">💥</div>
    <h1 class="title" style="font-size: clamp(40px,10vw,88px)">GAME OVER</h1>
    <p class="final-score">You sliced <b id="finalScore">0</b> points</p>
    <p class="new-best" id="newBest" style="display:none">★ New Best! ★</p>
    <button class="btn" id="againBtn">Play Again</button>
  </div>

  <!-- README modal (rendered from README.md at runtime) -->
  <div class="modal-backdrop hidden" id="readmeModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="readmeTitle">
      <button class="modal-close" id="readmeClose" aria-label="Close">×</button>
      <div class="modal-body" id="readmeBody"><p class="modal-loading">Loading…</p></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const stage  = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx    = canvas.getContext('2d');

  const scoreEl   = document.getElementById('score');
  const bestEl    = document.getElementById('best');
  const livesEl   = document.getElementById('lives');
  const comboEl   = document.getElementById('combo');
  const startScreen = document.getElementById('startScreen');
  const overScreen  = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const newBestEl    = document.getElementById('newBest');
  const overEmoji    = document.getElementById('overEmoji');

  // ---------- Sizing (retina-aware) ----------
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Fruit definitions ----------
  // kind drives the realistic garnish (stripes, citrus skin, stem/leaf...).
  // light/body/dark feed a spherical radial gradient; inner is the sliced flesh.
  const FRUITS = [
    { name: 'watermelon', kind: 'watermelon', light: '#4bd07a', body: '#27a052', dark: '#0f5c2b', inner: '#ff5a6b', innerEdge: '#e63e50', seeds: 'black', r: 52 },
    { name: 'orange',     kind: 'citrus',     light: '#ffc14d', body: '#ff951c', dark: '#c96700', inner: '#ffb44d', innerEdge: '#ff8c1a', seeds: false,   r: 40 },
    { name: 'lemon',      kind: 'citrus',     light: '#fff27a', body: '#ffe14d', dark: '#d4a400', inner: '#fff08a', innerEdge: '#ffe14d', seeds: false, r: 38 },
    { name: 'apple',      kind: 'apple',      light: '#ff7a6b', body: '#e23c30', dark: '#9e2018', inner: '#fff4e0', innerEdge: '#f3e2c4', seeds: 'brown', r: 42 },
    { name: 'kiwi',       kind: 'kiwi',       light: '#9c7a4a', body: '#7c5c33', dark: '#4c3820', inner: '#a8d46a', innerEdge: '#c5e59a', seeds: 'ring',  r: 37 },
    { name: 'plum',       kind: 'berry',      light: '#b06bd0', body: '#7e3b9e', dark: '#4a2160', inner: '#e0a86b', innerEdge: '#d59a5c', seeds: 'pit',   r: 37 },
    { name: 'lime',       kind: 'citrus',     light: '#a6e05a', body: '#78c23a', dark: '#4a8020', inner: '#c8f0a0', innerEdge: '#a4e070', seeds: false,   r: 37 },
  ];

  // ---------- State ----------
  const GRAVITY = 0.38;
  let objects = [];     // fruits + bombs in play
  let bits    = [];     // fruit halves + juice particles
  let sparks  = [];     // slash trail glints
  let running = false;
  let score = 0;
  let lives = 3;
  let best  = 0;
  let spawnTimer = 0;
  let spawnGap = 62;
  let elapsed = 0;
  let comboCount = 0;
  let comboTimer = 0;
  const COMBO_WINDOW = 22; // frames to keep a combo alive

  // ---------- Blade trail ----------
  const blade = [];
  let pointerDown = false;
  let lastPX = 0, lastPY = 0;

  function pointerPos(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function addBladePoint(x, y) {
    blade.push({ x, y, life: 1 });
    if (blade.length > 18) blade.shift();
  }
  function onDown(e) {
    if (!running) return;
    pointerDown = true;
    const p = pointerPos(e);
    lastPX = p.x; lastPY = p.y;
    blade.length = 0;
    addBladePoint(p.x, p.y);
  }
  function onMove(e) {
    if (!running || !pointerDown) return;
    const p = pointerPos(e);
    addBladePoint(p.x, p.y);
    sliceCheck(lastPX, lastPY, p.x, p.y);
    lastPX = p.x; lastPY = p.y;
    if (e.cancelable) e.preventDefault();
  }
  function onUp() { pointerDown = false; }

  stage.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  stage.addEventListener('touchstart', onDown, { passive: false });
  stage.addEventListener('touchmove', onMove, { passive: false });
  stage.addEventListener('touchend', onUp);

  // ---------- Spawning ----------
  function spawn() {
    // difficulty scales with time
    const diff = Math.min(elapsed / 3600, 1); // ramps over ~60s
    const bombChance = 0.08 + diff * 0.14;
    const multiChance = 0.25 + diff * 0.35;

    const count = Math.random() < multiChance ? (Math.random() < 0.35 ? 3 : 2) : 1;
    for (let i = 0; i < count; i++) {
      const isBomb = Math.random() < bombChance;
      const x = 80 + Math.random() * (W - 160);
      const fromLeft = x < W / 2;
      // launch upward, angled toward center-ish
      const vy = -(15.5 + Math.random() * 4 + diff * 2);
      const vx = (fromLeft ? 1 : -1) * (Math.random() * 3.2 + 0.4);
      const def = FRUITS[(Math.random() * FRUITS.length) | 0];
      objects.push({
        x, y: H + 60,
        vx, vy,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.18,
        r: isBomb ? 40 : def.r,
        def, isBomb,
        sliced: false,
      });
    }
  }

  // ---------- Slicing ----------
  function segCircleHit(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx * dx + dy * dy || 1;
    let t = ((cx - x1) * dx + (cy - y1) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = x1 + t * dx, py = y1 + t * dy;
    const ddx = cx - px, ddy = cy - py;
    return (ddx * ddx + ddy * ddy) <= r * r;
  }

  function sliceCheck(x1, y1, x2, y2) {
    const moved = Math.hypot(x2 - x1, y2 - y1);
    if (moved < 4) return; // need real motion to cut
    for (const o of objects) {
      if (o.sliced) continue;
      if (segCircleHit(x1, y1, x2, y2, o.x, o.y, o.r + 6)) {
        sliceObject(o, Math.atan2(y2 - y1, x2 - x1));
      }
    }
    // trail glint
    sparks.push({ x: x2, y: y2, life: 1 });
  }

  function sliceObject(o, angle) {
    o.sliced = true;
    if (o.isBomb) {
      explodeBomb(o);
      loseLife();
      return;
    }
    // scoring + combo
    comboCount++;
    comboTimer = COMBO_WINDOW;
    let gain = 1;
    if (comboCount >= 2) gain = comboCount; // combo bonus
    addScore(gain);
    if (comboCount >= 3) showCombo(comboCount);

    spawnHalves(o, angle);
    spawnJuice(o);
  }

  function spawnHalves(o, angle) {
    const perp = angle + Math.PI / 2;
    for (let s = -1; s <= 1; s += 2) {
      bits.push({
        type: 'half',
        x: o.x, y: o.y,
        vx: o.vx + Math.cos(perp) * s * 2.6,
        vy: o.vy - 1.5,
        rot: o.rot,
        vr: s * 0.14,
        r: o.r,
        def: o.def,
        side: s,
        cut: angle,
        life: 1,
      });
    }
  }

  function spawnJuice(o) {
    const c = o.def.inner;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 6 + 1.5;
      bits.push({
        type: 'juice',
        x: o.x, y: o.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
        r: Math.random() * 5 + 2,
        color: c,
        life: 1,
      });
    }
  }

  function explodeBomb(o) {
    for (let i = 0; i < 34; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 9 + 2;
      bits.push({
        type: 'juice',
        x: o.x, y: o.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
        r: Math.random() * 4 + 2,
        color: Math.random() < 0.5 ? '#ff6b3c' : '#ffd23f',
        life: 1,
      });
    }
    flashScreen();
  }

  // ---------- Score / lives / combo ----------
  function addScore(n) {
    score += n;
    scoreEl.textContent = score;
    scoreEl.animate(
      [{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }],
      { duration: 180, easing: 'ease-out' }
    );
  }

  function showCombo(n) {
    comboEl.textContent = `${n}  COMBO!  +${n}`;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth; // reflow to restart animation
    comboEl.classList.add('show');
  }

  function buildLives() {
    livesEl.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('class', 'life');
      s.setAttribute('viewBox', '0 0 32 32');
      s.innerHTML = '<path d="M16 28C16 28 3 20 3 11.5C3 7 6.5 4 10 4C13 4 15 6 16 8C17 6 19 4 22 4C25.5 4 29 7 29 11.5C29 20 16 28 16 28Z" fill="#ff3b5c" stroke="#fff" stroke-width="1.5"/>';
      livesEl.appendChild(s);
    }
  }

  function loseLife() {
    lives--;
    const hearts = livesEl.querySelectorAll('.life');
    if (hearts[lives]) hearts[lives].classList.add('lost');
    flashScreen();
    if (lives <= 0) endGame();
  }

  let flashAlpha = 0;
  function flashScreen() { flashAlpha = 0.6; }

  // ---------- Game flow ----------
  function loadBest() {
    try { best = parseInt(localStorage.getItem('fn_best') || '0', 10) || 0; }
    catch { best = 0; }
    bestEl.textContent = 'Best ' + best;
  }
  function saveBest() {
    try { localStorage.setItem('fn_best', String(best)); } catch {}
  }

  function startGame() {
    score = 0; lives = 3; objects = []; bits = []; sparks = [];
    spawnTimer = 0; spawnGap = 62; elapsed = 0;
    comboCount = 0; comboTimer = 0;
    scoreEl.textContent = '0';
    buildLives();
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    running = true;
  }

  function endGame() {
    running = false;
    const isBest = score > best;
    if (isBest) { best = score; saveBest(); bestEl.textContent = 'Best ' + best; }
    finalScoreEl.textContent = score;
    newBestEl.style.display = isBest ? 'block' : 'none';
    overEmoji.textContent = score === 0 ? '🍌' : (isBest ? '🏆' : '💥');
    setTimeout(() => overScreen.classList.remove('hidden'), 550);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);

  // ---------- Drawing ----------
  // Spherical body: light source top-left, darkening toward the lower-right rim.
  function sphereFill(r, light, body, dark) {
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
    g.addColorStop(0, light);
    g.addColorStop(0.5, body);
    g.addColorStop(1, dark);
    return g;
  }
  // Glossy specular dot + soft ambient sheen shared by every round fruit.
  function addGloss(r) {
    ctx.beginPath();
    ctx.ellipse(-r * 0.34, -r * 0.4, r * 0.26, r * 0.16, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-r * 0.42, -r * 0.46, r * 0.09, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fill();
  }

  function drawFruit(o) {
    const r = o.r, d = o.def;
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rot);

    // base sphere
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = sphereFill(r, d.light, d.body, d.dark);
    ctx.fill();

    // rim shadow for volume
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.lineWidth = r * 0.1;
    ctx.strokeStyle = 'rgba(0,0,0,0.14)';
    ctx.stroke();

    // per-kind garnish
    if (d.kind === 'watermelon') {
      // dark curved rind stripes
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
      ctx.strokeStyle = 'rgba(15,70,35,0.55)';
      ctx.lineWidth = r * 0.14;
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(i * r * 0.3, -r * 1.2);
        ctx.quadraticCurveTo(i * r * 0.42 + Math.sign(i) * r * 0.2, 0, i * r * 0.3, r * 1.2);
        ctx.stroke();
      }
      ctx.restore();
    } else if (d.kind === 'citrus') {
      // dimpled skin: scattered darker pores
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      for (let i = 0; i < 26; i++) {
        const a = i * 2.399, rad = Math.sqrt(i / 26) * r * 0.85;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, r * 0.03, 0, Math.PI * 2);
        ctx.fill();
      }
      // navel dimple
      ctx.beginPath();
      ctx.arc(0, r * 0.78, r * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = d.dark;
      ctx.fill();
    } else if (d.kind === 'apple') {
      // waxy vertical highlight band
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
      const band = ctx.createLinearGradient(-r, 0, r * 0.3, 0);
      band.addColorStop(0, 'rgba(255,255,255,0)');
      band.addColorStop(0.5, 'rgba(255,255,255,0.18)');
      band.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = band;
      ctx.fillRect(-r, -r, r * 0.9, r * 2);
      ctx.restore();
      // stem + leaf
      ctx.strokeStyle = '#5a3a1e';
      ctx.lineWidth = r * 0.09;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.9);
      ctx.quadraticCurveTo(r * 0.12, -r * 1.15, r * 0.06, -r * 1.28);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(r * 0.28, -r * 1.12, r * 0.22, r * 0.11, -0.5, 0, Math.PI * 2);
      ctx.fillStyle = '#4fa235';
      ctx.fill();
    } else if (d.kind === 'kiwi') {
      // fuzzy matte skin speckle
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      for (let i = 0; i < 40; i++) {
        const a = i * 2.399, rad = Math.sqrt(i / 40) * r * 0.9;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * rad, Math.sin(a) * rad, r * 0.025, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (d.kind === 'berry') {
      // plum crease down one side
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
      ctx.lineWidth = r * 0.08;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.95);
      ctx.quadraticCurveTo(-r * 0.35, 0, 0, r * 0.95);
      ctx.stroke();
      // tiny stem nub
      ctx.fillStyle = '#3a5a2a';
      ctx.beginPath();
      ctx.arc(0, -r * 0.92, r * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }

    addGloss(r);
    ctx.restore();
  }

  function drawHalf(b) {
    const r = b.r, d = b.def;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.globalAlpha = Math.max(0, b.life);
    // clip to a half based on the cut angle
    ctx.rotate(b.cut);
    ctx.beginPath();
    if (b.side > 0) ctx.arc(0, 0, r, 0, Math.PI);
    else ctx.arc(0, 0, r, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.clip();

    // outer rind (shaded)
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = sphereFill(r, d.light, d.body, d.dark);
    ctx.fill();

    // exposed flesh — radial gradient from juicy centre to paler edge
    const fg = ctx.createRadialGradient(0, 0, r * 0.05, 0, 0, r * 0.86);
    fg.addColorStop(0, d.inner);
    fg.addColorStop(1, d.innerEdge);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.84, 0, Math.PI * 2);
    ctx.fillStyle = fg;
    ctx.fill();

    // glossy wet cut face
    ctx.beginPath();
    ctx.rect(-r, b.side > 0 ? 0 : -3, r * 2, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();

    // seeds / pit vary by fruit
    const y = b.side * r * 0.34;
    if (d.seeds === 'black') {           // watermelon
      ctx.fillStyle = 'rgba(30,20,10,0.85)';
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.ellipse(i * r * 0.2, y, r * 0.05, r * 0.09, i * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (d.seeds === 'brown') {    // apple core
      ctx.fillStyle = 'rgba(80,50,20,0.8)';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(i * r * 0.18, b.side * r * 0.2, r * 0.05, r * 0.09, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (d.seeds === 'ring') {     // kiwi: white core + seed ring
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(20,20,20,0.75)';
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42, r * 0.03, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (d.seeds === 'pit') {      // plum stone
      ctx.fillStyle = 'rgba(120,70,30,0.85)';
      ctx.beginPath();
      ctx.ellipse(0, b.side * r * 0.28, r * 0.16, r * 0.24, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {                             // citrus segments
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawBomb(o) {
    const r = o.r;
    ctx.save();
    ctx.translate(o.x, o.y);

    // dark contact shadow beneath already drawn by caller; body sphere here.
    // The bomb doesn't spin its highlight — keep light fixed, rotate only the body texture subtly.
    ctx.save();
    ctx.rotate(o.rot);

    // cast-iron sphere with metallic radial shading
    const g = ctx.createRadialGradient(-r * 0.4, -r * 0.45, r * 0.1, 0, 0, r * 1.1);
    g.addColorStop(0, '#6b6f78');
    g.addColorStop(0.35, '#33373f');
    g.addColorStop(0.8, '#14151a');
    g.addColorStop(1, '#050506');
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    // subtle reflected rim light on the dark side
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI * 0.15, Math.PI * 0.75);
    ctx.lineWidth = r * 0.07;
    ctx.strokeStyle = 'rgba(120,140,180,0.25)';
    ctx.stroke();
    ctx.restore();

    // fuse collar (metal ring on top) — fixed orientation
    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.86, r * 0.24, r * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#555';
    ctx.fillRect(-r * 0.18, -r * 1.02, r * 0.36, r * 0.2);
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(0, -r * 1.02, r * 0.18, r * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();

    // curved fuse
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = r * 0.12;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.05);
    ctx.quadraticCurveTo(r * 0.5, -r * 1.5, r * 0.32, -r * 1.75);
    ctx.stroke();

    // sparks at the fuse tip (flicker via index-free jitter using elapsed)
    const tipX = r * 0.32, tipY = -r * 1.75;
    const flick = (elapsed % 6) / 6;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + elapsed * 0.3;
      const rad = r * (0.14 + flick * 0.12);
      ctx.beginPath();
      ctx.arc(tipX + Math.cos(a) * rad, tipY + Math.sin(a) * rad, r * 0.05, 0, Math.PI * 2);
      ctx.fillStyle = i % 2 ? '#ffd23f' : '#ff6b3c';
      ctx.fill();
    }
    // hot core glow
    const glow = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, r * 0.4);
    glow.addColorStop(0, 'rgba(255,240,180,0.9)');
    glow.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(tipX, tipY, r * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // glossy specular highlight on the body (fixed light, drawn last)
    ctx.beginPath();
    ctx.ellipse(-r * 0.34, -r * 0.42, r * 0.22, r * 0.13, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-r * 0.42, -r * 0.48, r * 0.07, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fill();

    ctx.restore();
  }

  function drawBlade() {
    if (blade.length < 2) return;
    // glow underlay
    for (let pass = 0; pass < 2; pass++) {
      ctx.beginPath();
      ctx.moveTo(blade[0].x, blade[0].y);
      for (let i = 1; i < blade.length; i++) ctx.lineTo(blade[i].x, blade[i].y);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      if (pass === 0) {
        ctx.strokeStyle = 'rgba(120,200,255,0.25)';
        ctx.lineWidth = 22;
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 6;
      }
      ctx.stroke();
    }
  }

  // ---------- Loop ----------
  function update() {
    if (running) {
      elapsed++;
      // combo decay
      if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) comboCount = 0; }

      // spawning with gentle difficulty ramp
      spawnTimer++;
      const gap = Math.max(28, spawnGap - elapsed / 120);
      if (spawnTimer >= gap) { spawnTimer = 0; spawn(); }

      // update objects
      for (const o of objects) {
        o.x += o.vx; o.y += o.vy; o.vy += GRAVITY; o.rot += o.vr;
      }
      // remove & penalize missed fruit (fell off bottom, un-sliced)
      objects = objects.filter(o => {
        if (o.y - o.r > H + 40) {
          if (!o.sliced && !o.isBomb) loseLife();
          return false;
        }
        return true;
      });
    }

    // bits (halves + juice) always animate
    for (const b of bits) {
      b.x += b.vx; b.y += b.vy; b.vy += GRAVITY * (b.type === 'juice' ? 0.9 : 1);
      if (b.type === 'half') { b.rot += b.vr; b.life -= 0.012; }
      else { b.life -= 0.03; b.r *= 0.985; }
    }
    bits = bits.filter(b => b.life > 0 && b.y - 60 < H + 80);

    // fade blade points & sparks
    for (const p of blade) p.life -= 0.06;
    for (const s of sparks) s.life -= 0.08;
    sparks = sparks.filter(s => s.life > 0);
    if (flashAlpha > 0) flashAlpha -= 0.04;
  }

  function render() {
    // background gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2a1a4a');
    g.addColorStop(1, '#12132b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // soft vignette glow
    const rg = ctx.createRadialGradient(W/2, H*0.4, 40, W/2, H*0.4, Math.max(W, H)*0.7);
    rg.addColorStop(0, 'rgba(255,220,150,0.06)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    // juice + halves behind fruit
    for (const b of bits) {
      if (b.type === 'juice') {
        ctx.globalAlpha = Math.max(0, b.life);
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    for (const b of bits) if (b.type === 'half') drawHalf(b);
    ctx.globalAlpha = 1;

    // live objects
    for (const o of objects) {
      if (o.sliced) continue;
      // shadow
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.ellipse(o.x, o.y + o.r * 0.9, o.r * 0.8, o.r * 0.3, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#000';
      ctx.fill();
      ctx.restore();
      if (o.isBomb) drawBomb(o); else drawFruit(o);
    }

    // slash sparks
    for (const s of sparks) {
      ctx.globalAlpha = s.life;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 8 * s.life + 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawBlade();

    // damage flash
    if (flashAlpha > 0) {
      ctx.fillStyle = `rgba(255,40,40,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  loadBest();
  loop();
})();
</script>
</body>
</html>
